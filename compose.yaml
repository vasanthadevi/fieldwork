services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chinook
      POSTGRES_PASSWORD: local-only
    volumes:
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chinook"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs the checker once, then exits: docker compose run --rm fieldwork
  fieldwork:
    profiles: [run]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      READONLY_DATABASE_URL: postgresql://copilot_readonly:readonly@db:5432/chinook
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./runs:/app/runs
      - ./evals:/app/evals
      - ./generated:/app/generated
      - ./web/public/data:/app/web/public/data

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "8080:80"
